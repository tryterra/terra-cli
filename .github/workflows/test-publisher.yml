name: test-publisher
on:
  push:
    paths: ['.github/scripts/**', '.github/workflows/publish-npm.yml', '.github/workflows/test-publisher.yml']
  pull_request:
    paths: ['.github/scripts/**', '.github/workflows/publish-npm.yml', '.github/workflows/test-publisher.yml']
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test .github/scripts/npm-packages.test.mjs
