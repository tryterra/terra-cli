name: publish-npm

# npm's trusted publishers match on this filename, so renaming this file
# breaks publishing for all packages.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.0.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing rejects self-hosted runners
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24" # OIDC needs npm >= 11.5.1
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check npm is new enough for OIDC
        run: |
          set -euo pipefail
          have=$(npm --version)
          echo "npm $have"
          printf '%s\n%s\n' "11.5.1" "$have" | sort -V -C \
            || { echo "npm $have is too old for trusted publishing (need >= 11.5.1)"; exit 1; }

      - name: Work out which release to publish
        id: rel
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The update notifier only compares plain X.Y.Z, so a prerelease on the
          # latest dist-tag would silence it rather than advertise itself.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the npm tarballs from the release
        run: |
          set -euo pipefail
          mkdir -p tarballs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tgz' --dir tarballs
          ls -1 tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}

      - name: Derive and validate packages from the released wrapper registry
        run: node .github/scripts/npm-packages.mjs "$VERSION" tarballs > packages.tsv
        env:
          VERSION: ${{ steps.rel.outputs.version }}

      - name: Publish registry packages with the wrapper last
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name archive; do
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published, skipping"
              continue
            fi
            npm publish --access public --tag "$DIST_TAG" "./tarballs/$archive"
          done < packages.tsv
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          DIST_TAG: ${{ steps.rel.outputs.dist_tag }}

      - name: Report what landed
        run: |
          set -euo pipefail
          {
            echo "### Published to npm"
            echo
            echo "| package | version | dist-tag |"
            echo "|---|---|---|"
            while IFS=$'\t' read -r name archive; do
              echo "| $name | $VERSION | $DIST_TAG |"
            done < packages.tsv
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          DIST_TAG: ${{ steps.rel.outputs.dist_tag }}
